[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "vectorharbor"
version = "1.0.0"
description = "Tenant-safe event ingestion and background processing"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3",
  "SQLAlchemy>=2.0.35,<3", "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.4,<6", "PyJWT>=2.9,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]
[tool.setuptools.packages.find]
where = ["."]
include = ["vectorharbor*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
# FastAPI declares dependencies in parameter defaults by design; style modernization
# and import ordering are handled separately from correctness checks.
ignore = ["I001", "B008", "UP017"]
